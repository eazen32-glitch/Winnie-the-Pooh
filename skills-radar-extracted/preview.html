<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Extracted skills radar</title><link rel="stylesheet" href="skills_radar/static/radar.css"></head>
<body style="margin:0;background:#f6f7f3">
<section class="skills-radar" data-skills-radar aria-label="Skills and roles radar">
            <p data-sr-monitor class="table-note" role="status">Loading dated source evidence…</p>
            <div class="toolbar">
              <div class="search-box">
                <span aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></svg></span
                ><input
                  type="search"
                  data-sr-search
                  aria-label="Search skills and roles"
                  placeholder="Search skills or roles…"
                />
              </div>
              <div class="segmented" role="group" aria-label="Radar category">
                <button
                  class="selected"
                  type="button"
                  data-sr-tab="skills"
                  aria-pressed="true"
                >
                  Skills</button
                ><button
                  type="button"
                  data-sr-tab="roles"
                  aria-pressed="false"
                >
                  Roles
                </button>
              </div>
              <label class="select-label" 
                >Signal
                <select data-sr-filter>
                  <option value="all">All signals</option>
                  <option value="rising">Rising</option>
                  <option value="declining">Declining</option>
                  <option value="stable">Stable</option>
                  <option value="insufficient">Limited evidence</option>
                </select></label
              >
            </div>
            <div class="card radar-table-card">
              <div class="table-scroll">
                <table class="radar-table">
                  <caption class="sr-only">
                    Job sample skill and role signals
                  </caption>
                  <thead>
                    <tr>
                      <th scope="col">Skill / role</th>
                      <th scope="col">Recent postings</th>
                      <th scope="col">Earlier postings</th>
                      <th scope="col">Sample direction</th>
                      <th scope="col">SDG connection</th>
                      <th scope="col">Evidence</th>
                    </tr>
                  </thead>
                  <tbody data-sr-body></tbody>
                </table>
              </div>
            </div>
          </section>
<script src="preview-data.js"></script><script src="skills_radar/static/radar.js" defer></script>
</body></html>
