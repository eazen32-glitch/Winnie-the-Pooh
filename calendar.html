<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="View job acceptance deadlines and your confirmed meetings in one calendar.">
<title>Calendar</title>
<style>
:root{
    font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    color:#252831;
    background:#fcfcfd;
    font-synthesis:none
}*{
    box-sizing:border-box
}body{
    margin:0;
    min-height:100vh
}button{
    font:inherit;
    cursor:pointer
}button:focus-visible{
    outline:3px solid #a5a0ed;
    outline-offset:3px
}svg{
    width:20px;
    height:20px;
    fill:none;
    stroke:currentColor;
    stroke-width:1.7;
    stroke-linecap:round;
    stroke-linejoin:round
}.top{
    height:104px;
    padding:30px 48px;
    display:flex;
    justify-content:flex-end
}.calendar-trigger{
    display:flex;
    align-items:center;
    gap:11px;
    border:1px solid #dddde7;
    border-radius:12px;
    background:#fff;
    padding:12px 17px;
    color:#36313f;
    font-size:14px;
    font-weight:600;
    box-shadow:0 2px 3px #24213604;
    transition:background .18s,box-shadow .18s
}.calendar-trigger:hover,.calendar-trigger[aria-expanded=true]{
    background:#f5f3ff;
    border-color:#c5bee9;
    box-shadow:0 4px 12px #48358b0b
}.calendar-trigger>svg{color:#7560b8}.calendar-trigger .chevron{
    width:14px;
    height:14px;
    margin-left:6px;
    color:#8d8898;
    transition:transform .2s
}.calendar-trigger[aria-expanded=true] .chevron{transform:rotate(180deg)}[hidden]{display:none!important}.popover{
    position:absolute;
    right:48px;
    top:92px;
    width:min(850px,calc(100vw - 48px));
    border:1px solid #e5e4ec;
    border-radius:20px;
    background:#fff;
    box-shadow:0 24px 80px #25213512,0 4px 14px #25213505;
    overflow:hidden;
    animation:appear .18s ease-out;z-index:2
}@keyframes appear{from{
    opacity:0;transform:translateY(-5px)}to{opacity:1;transform:translateY(0)}
}.head{
    padding:26px 28px 22px;
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    border-bottom:1px solid #eeedf2
}.title-line{
    display:flex;
    align-items:center;
    gap:10px
}h1{
    font-size:20px;
    letter-spacing:-.5px;
    margin:0;
    font-weight:650
}.demo{
    font-size:10px;
    font-weight:600;
    letter-spacing:.3px;
    padding:4px 6px;
    border-radius:5px;
    background:#f3f2f6;
    color:#908999
}.head p{
    margin:8px 0 0;
    color:#8a8693;
    font-size:12px
}.icon-btn{
    border:0;
    background:transparent;
    border-radius:8px;
    padding:6px;
    color:#96909f;
    display:inline-flex;
    align-items:center;
    justify-content:center
}.icon-btn:hover{
    background:#f5f3f8;
    color:#534467
}.icon-btn svg{
    width:18px;
    height:18px
}.body{
    display:grid;
    grid-template-columns:1fr 270px
}.month-panel{
    padding:25px 26px 20px;
    min-width:0
}.month-toolbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:23px
}.month-title{
    font-size:16px;
    letter-spacing:-.3px;
    font-weight:650
}.month-actions{
    display:flex;
    align-items:center;
    gap:6px
}.today-btn{
    background:#fff;
    border:1px solid #e7e4ed;
    border-radius:7px;
    padding:6px 10px;
    font-size:11px;
    font-weight:500;
    color:#6b6279;
    margin-right:5px
}.today-btn:hover{
    background:#f7f5fb
}.weekdays,.grid{
    display:grid;
    grid-template-columns:repeat(7,minmax(0,1fr))
}.weekdays span{
    text-align:center;
    color:#a29ba9;
    font-size:10px;
    font-weight:600;
    padding:0 0 14px
}.day{
    height:57px;
    border:0;
    border-radius:10px;
    background:transparent;
    position:relative;
    color:#514c59;
    font-size:12px;
    display:flex;
    align-items:center;
    flex-direction:column;
    justify-content:center;gap:7px
}.day:hover{
    background:#f5f3f9
}.day.other{color:#c7c2ce}.day.today .num{
    border-bottom:2px solid #a397ce;
    padding-bottom:2px
}.day.selected{
    background:#7760b5;
    color:#fff;
    box-shadow:0 3px 7px #5e43991a
}.day.selected:hover{background:#6b53ab}.day .dots{
    height:4px;
    display:flex;
    gap:3px
}.dot{
    width:4px;
    height:4px;
    border-radius:50%;
    display:inline-block;
    background:#dda653
}.dot.meeting{background:#9a87d0}.selected .dot{background:#fff}.selected .dot.deadline{background:#f9d696}.filters{display:flex;gap:17px;flex-wrap:wrap;border-top:1px solid #f0edf4;margin-top:18px;padding-top:18px}.filter{display:flex;align-items:center;gap:7px;color:#8c8396;font-size:10px;background:transparent;border:0;padding:3px 0}.filter .dot{width:6px;height:6px}.filter[aria-pressed=false]{opacity:.4}.filter[aria-pressed=false] span:last-child{text-decoration:line-through}.agenda{border-left:1px solid #eeedf2;background:#fdfcfe;padding:27px 22px;min-height:450px}.agenda-date{font-size:10px;font-weight:600;letter-spacing:1.2px;color:#a39aaD;text-transform:uppercase;margin:0 0 6px}.agenda h2{font-size:16px;font-weight:600;letter-spacing:-.3px;margin:0 0 23px}.event{padding:0 0 0 12px;border-left:2px solid #dcb377;margin-bottom:25px}.event.meeting{border-color:#aa98d6}.event-type{font-size:9px;color:#b48e55;letter-spacing:.2px;font-weight:600;display:flex;align-items:center;gap:5px}.meeting .event-type{color:#9078bd}.event h3{font-size:12px;line-height:1.5;font-weight:600;margin:7px 0 4px}.event p{font-size:10px;line-height:1.6;color:#9991a3;margin:0}.event-time{margin-top:10px!important;display:flex;gap:5px;align-items:center;color:#7d7489!important}.event-time svg{height:12px;width:12px}.status{display:inline-block;font-size:9px;border-radius:4px;padding:3px 6px;background:#f1ecf8;color:#947cbd;margin-top:10px}.empty{color:#a49aaa;font-size:12px;line-height:1.8;margin-top:28px}.empty svg{width:27px;height:27px;margin-bottom:9px;color:#c5bace}.empty p{margin:0}.foot{padding:14px 28px;border-top:1px solid #eeedf2;display:flex;justify-content:space-between;align-items:center;font-size:10px;color:#a9a1b1}.foot span{display:flex;gap:6px;align-items:center}.foot svg{height:12px;width:12px}.foot .zone{color:#928899}@media(max-width:650px){.top{padding:22px 22px;height:90px}.popover{right:12px;top:82px;width:calc(100vw - 24px);max-height:calc(100dvh - 96px);overflow-y:auto;border-radius:16px}.head{padding:21px}.head p{font-size:11px}.body{grid-template-columns:1fr}.month-panel{padding:21px}.day{height:48px}.agenda{min-height:auto;border-left:0;border-top:1px solid #eeedf2;padding:23px}.agenda h2{margin-bottom:20px}.event{display:inline-block;width:calc(50% - 10px);vertical-align:top;margin-right:7px;margin-bottom:10px}.foot{padding:14px 21px;gap:12px;align-items:flex-start}.filters{gap:20px}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.popover{position:fixed;inset:0;margin:auto;padding:0;width:min(850px,calc(100vw - 48px));max-width:none;max-height:calc(100dvh - 48px);overflow:auto;color:inherit;box-shadow:0 30px 100px #2521352b,0 8px 24px #25213512;overscroll-behavior:contain}.popover::backdrop{background:rgb(35 29 48 / 32%);backdrop-filter:blur(3px);animation:appear .18s ease-out}body.calendar-open{overflow:hidden}.calendar-open .top{pointer-events:none}@media(max-width:650px){.popover{inset:0;margin:auto;width:calc(100vw - 24px);max-height:calc(100dvh - 24px)}}

/* Calendar button */
.calendar-trigger {
  background: #d8e6f8;
  border-color: #99c2f5;
  color: #1d4ed8;
}
.calendar-trigger > svg { color: #2563eb; }

/* Selected date */
.day.selected { background: #2563eb; }
.day.selected:hover { background: #1d4ed8; }

/* Meeting markers */
.dot.meeting { background: #60a5fa; }
.event.meeting { border-color: #60a5fa; }

/* Dimmed background behind the pop-out */
.popover::backdrop {
  background: rgb(15 23 42 / 35%);
}
</style>
</head>
<body>
<header class="top">
    <button class="calendar-trigger" id="calendarButton" aria-expanded="false" aria-controls="calendarPopover" aria-haspopup="dialog">
        <svg aria-hidden="true" viewBox="0 0 24 24">
            <rect x="3" y="5" width="18" height="16" rx="3"/>
            <path d="M16 3v4M8 3v4M3 11h18M8 15h2M14 15h2"/>
        </svg>
        <span>Calendar</span>
        <svg class="chevron" aria-hidden="true" viewBox="0 0 24 24">
            <path d="m7 10 5 5 5-5"/>
        </svg>
    </button>
</header>

<main>
<dialog class="popover" id="calendarPopover" aria-label="Your calendar" aria-modal="true">
<div class="head">
    <div>
        <div class="title-line">
            <h1>Your calendar</h1>
        </div>
        <p>Keep track on events.</p>
    </div>
    <button class="icon-btn" id="close" aria-label="Close calendar">
        <svg aria-hidden="true" viewBox="0 0 24 24">
            <path d="m6 6 12 12M18 6 6 18"/>
        </svg>
    </button>
</div>
<div class="body"><div class="month-panel"><div class="month-toolbar"><div class="month-title" id="monthTitle" aria-live="polite"></div><div class="month-actions"><button class="today-btn" id="today">Today</button><button class="icon-btn" id="previous" aria-label="Previous month"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="m14 6-6 6 6 6"/></svg></button><button class="icon-btn" id="next" aria-label="Next month"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="m10 6 6 6-6 6"/></svg></button></div></div><div class="weekdays" aria-hidden="true"><span>MON</span><span>TUE</span><span>WED</span><span>THU</span><span>FRI</span><span>SAT</span><span>SUN</span></div><div class="grid" id="days" role="group" aria-label="Calendar dates"></div><div class="filters" aria-label="Event filters"><button class="filter" data-type="deadline" aria-pressed="true"><span class="dot"></span><span>Job acceptance deadline</span></button><button class="filter" data-type="meeting" aria-pressed="true"><span class="dot meeting"></span><span>Accepted meeting</span></button></div></div><aside class="agenda" id="agenda" aria-live="polite"></aside></div>
<div class="foot"><span><svg aria-hidden="true" viewBox="0 0 24 24"></svg></span><span class="zone" id="timezone"></span></div>
</dialog>
</main>
<script>
const $=id=>document.getElementById(id);
const now=new Date();now.setHours(0,0,0,0);
let selected=new Date(now),view=new Date(now.getFullYear(),now.getMonth(),1);
const enabled={deadline:true,meeting:true};
const key=d=>`${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`;
const offset=n=>{const d=new Date(now);d.setDate(d.getDate()+n);return key(d)};

const events=[{date:offset(0),type:'deadline',title:'Software Engineer',company:'SDC Company',time:'Accept by 5:00 PM'},{date:offset(0),type:'meeting',title:'Interview Session',company:'Replit',time:'2:00 – 2:30 PM',accepted:true},{date:offset(3),type:'meeting',title:'Discovery meeting',company:'Forma Studio',time:'10:00 – 10:45 AM',accepted:true},{date:offset(5),type:'deadline',title:'Website design project',company:'Bloom Creative',time:'Accept by 6:00 PM'},{date:offset(8),type:'meeting',title:'Design review',company:'Studio North',time:'11:00 – 11:30 AM',accepted:true}];
const clock='<svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>';
function eventsOn(d){return events.filter(e=>e.date===key(d)&&enabled[e.type])}
function render(){
 $('monthTitle').textContent=view.toLocaleDateString('en',{month:'long',year:'numeric'});
 const start=new Date(view);start.setDate(1-((start.getDay()+6)%7));
 const fragment=document.createDocumentFragment();
 const count=Math.ceil((((view.getDay()+6)%7)+new Date(view.getFullYear(),view.getMonth()+1,0).getDate())/7)*7;
 for(let i=0;i<count;i++){
  const d=new Date(start);d.setDate(start.getDate()+i);const day=document.createElement('button');day.className='day'+(d.getMonth()!==view.getMonth()?' other':'')+(key(d)===key(now)?' today':'')+(key(d)===key(selected)?' selected':'');day.type='button';
  day.setAttribute('aria-pressed',String(key(d)===key(selected)));if(key(d)===key(now))day.setAttribute('aria-current','date');
  const items=eventsOn(d);day.setAttribute('aria-label',d.toLocaleDateString('en',{weekday:'long',month:'long',day:'numeric',year:'numeric'})+(items.length?`, ${items.length} event${items.length>1?'s':''}`:', no events'));
  day.innerHTML=`<span class="num">${d.getDate()}</span><span class="dots">${[...new Set(items.map(e=>e.type))].map(t=>`<span class="dot ${t}"></span>`).join('')}</span>`;
  day.addEventListener('click',()=>{selected=d;if(d.getMonth()!==view.getMonth()){view=new Date(d.getFullYear(),d.getMonth(),1)}render();[...$('days').children].find(el=>el.getAttribute('aria-pressed')==='true')?.focus()});fragment.append(day);
 }
 $('days').replaceChildren(fragment);
 const items=eventsOn(selected);
 $('agenda').innerHTML=`<p class="agenda-date">${key(selected)===key(now)?'Today':selected.toLocaleDateString('en',{weekday:'long'})}</p><h2>${selected.toLocaleDateString('en',{month:'long',day:'numeric'})}</h2>`+(items.length?items.map(e=>`<article class="event ${e.type}"><div class="event-type">${e.type==='deadline'?'ACCEPTANCE DEADLINE':'MEETING'}</div><h3>${e.title}</h3><p>${e.company}</p><p class="event-time">${clock}${e.time}</p>${e.accepted?'<span class="status">✓ Accepted</span>':''}</article>`).join(''):`<div class="empty"><svg aria-hidden="true" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M16 3v4M8 3v4M3 11h18m5 5 3 3 5-5"/></svg><p>No events for this day.</p><p>${!enabled.deadline||!enabled.meeting?'Try enabling both event filters.':'You have a little breathing room.'}</p></div>`);
}
function openCalendar(){render();$('calendarPopover').showModal();document.body.classList.add('calendar-open');$('calendarButton').setAttribute('aria-expanded','true');$('close').focus()}
function closeCalendar(){if($('calendarPopover').open)$('calendarPopover').close()}
$('calendarPopover').addEventListener('close',()=>{document.body.classList.remove('calendar-open');$('calendarButton').setAttribute('aria-expanded','false');$('calendarButton').focus()});
$('calendarButton').addEventListener('click',()=>{$('calendarPopover').open?closeCalendar():openCalendar()});
$('close').addEventListener('click',()=>closeCalendar(true));
$('calendarPopover').addEventListener('pointerdown',e=>{if(e.target!==$('calendarPopover'))return;const bounds=$('calendarPopover').getBoundingClientRect();if(e.clientX<bounds.left||e.clientX>bounds.right||e.clientY<bounds.top||e.clientY>bounds.bottom)closeCalendar()});
$('previous').addEventListener('click',()=>{view.setMonth(view.getMonth()-1);render()});
$('next').addEventListener('click',()=>{view.setMonth(view.getMonth()+1);render()});
$('today').addEventListener('click',()=>{selected=new Date(now);view=new Date(now.getFullYear(),now.getMonth(),1);render()});
document.querySelectorAll('.filter').forEach(button=>button.addEventListener('click',()=>{enabled[button.dataset.type]=!enabled[button.dataset.type];button.setAttribute('aria-pressed',String(enabled[button.dataset.type]));render()}));
$('timezone').textContent=Intl.DateTimeFormat().resolvedOptions().timeZone.replaceAll('_',' ');
</script>
</body>
</html>
